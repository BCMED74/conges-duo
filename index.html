<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d4ed8">
<title>Congés Duo</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Congés Duo">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{
  --bg:#eef1f6;--card:#fff;--ink:#1c2230;--mute:#667085;--line:#dde2ea;--work:#eef0f4;
  --a:#1d4ed8;--a-l:#bcd0fb;--b:#db2777;--b-l:#f9c6de;
  --extra:#15803d;--hol:#d92d20;--hol-l:#fcd9d6;--rest:#c9ced8;--bloc:#172554;--star:#e8a317;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#11141b;--card:#1b1f29;--ink:#e9ecf2;--mute:#9aa3b2;--line:#2b3140;--work:#242a36;
  --a:#4f86f7;--a-l:#2a4a8c;--b:#f0559a;--b-l:#7a2650;
  --extra:#34c26b;--hol:#ff6b5e;--hol-l:#4d2420;--rest:#3a4050;--bloc:#a9bcff;--star:#f5b82e;
  color-scheme:dark;
}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
body{padding-bottom:calc(70px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--a);outline-offset:2px}
.hide{display:none!important}
.muted{color:var(--mute);font-size:13px}
.center{text-align:center}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;
  padding:calc(10px + env(safe-area-inset-top)) 14px 10px;background:var(--card);border-bottom:1px solid var(--line)}
h1{margin:0;font-size:19px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
h1 .duo{display:inline-flex}
h1 .duo i{width:13px;height:13px;border-radius:50%;background:var(--a)}
h1 .duo i+i{background:var(--b);margin-left:-5px;mix-blend-mode:multiply}
@media (prefers-color-scheme:dark){h1 .duo i+i{mix-blend-mode:screen}}
.yearsel{display:flex;align-items:center;gap:2px}
.yearsel strong{min-width:46px;text-align:center;font-variant-numeric:tabular-nums}
.iconbtn{border:0;background:none;width:38px;height:38px;border-radius:10px;font-size:20px;cursor:pointer;color:var(--ink)}
.iconbtn:active{background:var(--work)}
.syncdot{position:relative;width:30px;height:38px;border:0;background:none;cursor:pointer}
.syncdot::after{content:"";position:absolute;inset:0;margin:auto;width:10px;height:10px;border-radius:50%;background:var(--rest)}
.syncdot.s-ok::after{background:var(--extra)}
.syncdot.s-wait::after{background:var(--star)}
.syncdot.s-err::after{background:var(--hol)}
.syncdot.s-busy::after{background:var(--a);animation:pulse .8s infinite alternate}
@keyframes pulse{to{opacity:.25}}
@media (prefers-reduced-motion:reduce){.syncdot.s-busy::after{animation:none}}
.syncline{font-size:13px;margin:8px 0 2px;color:var(--mute)}
a.btn{display:inline-block;text-decoration:none;color:inherit}
main{max-width:720px;margin:0 auto;padding:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.card h2,.dlg h2{margin:0 0 6px;font-size:17px}
.pa{--c:var(--a);--cl:var(--a-l)} .pb{--c:var(--b);--cl:var(--b-l)}
.dot{display:inline-block;flex:none;width:11px;height:11px;border-radius:50%;background:var(--c)}
.phead{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.phead h2{margin:0}
.person{border-top:4px solid var(--c)}
.kpi{display:flex;align-items:flex-end;gap:12px;margin:4px 0 10px}
.big{font-size:46px;line-height:1;font-weight:750;color:var(--c);font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.big.neg{color:var(--hol)}
.kl{font-size:14px;padding-bottom:4px}
.kl small{color:var(--mute)}
.bar{display:flex;height:8px;border-radius:4px;background:var(--work);overflow:hidden;margin-bottom:8px}
.bar i{display:block;height:100%}
.bar .p{background:var(--c)}
.bar .v{background:repeating-linear-gradient(135deg,var(--c) 0 3px,transparent 3px 6px)}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:6px 0;border-top:1px solid var(--line);font-size:14px}
.row b{font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.row small{font-weight:400}
/* Calendrier */
.monthbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.monthbar strong{font-size:18px;text-transform:capitalize}
.who{display:flex;justify-content:center;gap:16px;font-size:12px;color:var(--mute);margin-bottom:8px}
.who span{display:flex;align-items:center;gap:5px}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.dow{text-align:center;font-size:11px;color:var(--mute);padding-bottom:2px}
.day{position:relative;display:flex;flex-direction:column;gap:3px;min-height:60px;padding:4px 3px;border:1px solid var(--line);border-radius:9px;background:var(--card);text-align:left;cursor:pointer}
.day.empty{visibility:hidden}
.day .num{font-size:13px;font-weight:600;line-height:1.15;margin-bottom:auto;font-variant-numeric:tabular-nums}
.day.hol .num{color:var(--hol)}
.day.today{border:2px solid var(--ink)}
.day.both{background:color-mix(in srgb,var(--star) 9%,var(--card))}
.day .star{position:absolute;top:2px;right:4px;font-size:12px;line-height:1;color:var(--star)}
.day .otm{position:absolute;top:3px;right:17px;font-size:10px;font-weight:700;color:var(--b)}
.lane{display:flex;gap:1px;height:11px;border-radius:3px;overflow:hidden}
.lane .h{flex:1;background:var(--work)}
.h.k-rest{background:var(--rest)}
.h.k-hol{background:var(--hol-l)}
.h.k-conge.s-pris{background:var(--c)}
.h.k-conge.s-prevu{background:repeating-linear-gradient(135deg,var(--c) 0 2px,transparent 2px 5px);box-shadow:inset 0 0 0 1.5px var(--c)}
.h.k-recup.s-pris{background:var(--cl);box-shadow:inset 0 0 0 1.5px var(--c)}
.h.k-recup.s-prevu{background:repeating-linear-gradient(135deg,var(--cl) 0 2px,transparent 2px 5px);box-shadow:inset 0 0 0 1.5px var(--c)}
.h.k-bloc.s-pris{background:var(--bloc)}
.h.k-bloc.s-prevu{background:repeating-linear-gradient(135deg,var(--bloc) 0 2px,transparent 2px 5px);box-shadow:inset 0 0 0 1.5px var(--bloc)}
.h.k-extra.s-pris{background:var(--extra)}
.h.k-extra.s-prevu{background:repeating-linear-gradient(135deg,var(--extra) 0 2px,transparent 2px 5px);box-shadow:inset 0 0 0 1.5px var(--extra)}
.hols{font-size:13px;color:var(--hol);margin:10px 2px 0}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:12px;font-size:12px;color:var(--mute)}
.legend>span{display:flex;align-items:center;gap:4px}
.lane.sw{width:24px;height:10px;display:inline-flex}
.starl{color:var(--star)} .otl{color:var(--b)}
/* Ponts */
.opt{padding:10px 0;border-top:1px solid var(--line)}
.opt-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:4px}
.opt-p{display:flex;gap:7px;align-items:baseline;font-size:14px;margin:3px 0}
.opt .btn{margin-top:6px}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:6px;border:1px solid var(--line);color:var(--mute);vertical-align:1px}
.tag.prevu{border-style:dashed}
.tag.ok{color:var(--extra);border-color:var(--extra);margin-top:6px}
/* Liste */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:6px 14px;cursor:pointer;font-size:14px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.list{padding:4px 14px}
.entry{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.list .entry:first-child{border-top:0}
.entry .grow{flex:1;min-width:0}
.entry .iconbtn{width:34px;height:34px;font-size:16px;color:var(--mute)}
/* Formulaires */
.btn{border:1px solid var(--line);background:var(--card);border-radius:11px;padding:10px 15px;cursor:pointer}
.btn.pri{background:var(--a);border-color:var(--a);color:#fff}
.btn.danger{color:var(--hol);border-color:var(--hol)}
.btn.sm{padding:6px 11px;font-size:13px}
.btn.wide{width:100%;margin-bottom:10px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.btns.end{justify-content:flex-end}
.field{display:block;margin:10px 0}
.lbl{display:block;font-size:12px;color:var(--mute);margin-bottom:4px}
input:not([type=checkbox]):not([type=radio]),select,textarea{width:100%;min-width:0;font:inherit;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.row>span{min-width:8.5em}
.two .field{margin:10px 0 0}
.check{display:flex;align-items:center;gap:8px;margin:14px 0 4px;font-size:14px}
.check input{width:18px;height:18px;accent-color:var(--c)}
.sub{padding-left:12px;border-left:3px solid var(--cl)}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg label{flex:1;text-align:center;cursor:pointer;border-left:1px solid var(--line)}
.seg label:first-child{border-left:0}
.seg span{display:block;padding:9px 4px;font-size:14px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg input:checked+span{background:var(--ink);color:var(--bg)}
.seg input:focus-visible+span{outline:2px solid var(--a);outline-offset:-2px}
.days7{display:flex;gap:4px}
.days7 label{flex:1;text-align:center;border:1px solid var(--line);border-radius:8px;padding:7px 0;font-size:13px;cursor:pointer}
.days7 input{position:absolute;opacity:0;pointer-events:none}
.days7 label:has(input:checked){background:var(--rest);border-color:var(--rest);font-weight:600}
/* Sections repliables (Réglages) */
.sect{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:12px;overflow:hidden}
.sect>summary{display:flex;align-items:center;gap:10px;padding:15px 14px;font-weight:650;font-size:16px;cursor:pointer;list-style:none}
.sect>summary::-webkit-details-marker{display:none}
.sect>summary .grow{flex:1}
.sect .plus{width:28px;height:28px;border-radius:50%;background:var(--work);display:grid;place-items:center;font-size:18px;line-height:1}
.sect .plus::after{content:"+"}
.sect[open]>summary .plus::after{content:"−"}
.sect[open]>summary{border-bottom:1px solid var(--line)}
.sect-b{padding:4px 14px 12px}
.sect-b h4{margin:16px 0 0;font-size:14px}
.sect-b .card{margin-top:12px}
.calc{margin:8px 0 0;font-size:14px}
/* Voyages */
.trip-h{display:flex;align-items:flex-start;gap:8px}
.trip-h .grow{flex:1;min-width:0}
.who-l{display:flex;gap:12px;font-size:13px;margin-top:4px;flex-wrap:wrap}
.tnotes{white-space:pre-wrap;font-size:14px;margin:10px 0 0}
.item{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:14px;align-items:flex-start}
.item .ico{font-size:20px;line-height:1.2}
.item .grow{flex:1;min-width:0;overflow-wrap:anywhere}
.day .tripm{position:absolute;top:3px;left:22px;font-size:10px;line-height:1;color:var(--a)}
.hint-ios{border-color:var(--a);font-size:14px}
.dst{border-color:var(--star);font-size:14px}
/* Fenêtre */
dialog{border:0;padding:0;border-radius:18px;width:min(520px,94vw);background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgb(0 0 0 / .45)}
.dlg{padding:16px 16px 6px;max-height:86vh;overflow:auto}
.dlg h3{margin:16px 0 0;font-size:15px}
.holname{color:var(--hol);margin:0 0 4px;font-weight:600}
.existing .entry:first-child{border-top:0}
.hint{margin:4px 0}
/* Navigation */
.fab{position:fixed;right:16px;bottom:calc(80px + env(safe-area-inset-bottom));z-index:6;width:56px;height:56px;border:0;border-radius:18px;
  background:var(--a);color:#fff;font-size:30px;line-height:1;cursor:pointer;box-shadow:0 6px 18px rgb(29 78 216 / .35)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 0 7px;border:0;background:none;color:var(--mute);font-size:11px;cursor:pointer}
nav.tabs .ic{font-size:19px;line-height:1.2}
nav.tabs button.on{color:var(--a);font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));z-index:30;transform:translateX(-50%);max-width:90vw;
  padding:10px 16px;border-radius:12px;background:var(--ink);color:var(--bg);font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
@media (min-width:600px){.day{min-height:74px}.lane{height:13px}}
</style>
</head>
<body>
<header>
  <h1><span class="duo" aria-hidden="true"><i></i><i></i></span>Congés Duo</h1>
  <div class="yearsel">
    <button class="syncdot s-off" id="syncDot" data-act="sync" aria-label="Synchroniser avec GitHub"></button>
    <button class="iconbtn" data-act="year" data-d="-1" aria-label="Année précédente">‹</button>
    <strong id="yearLbl"></strong>
    <button class="iconbtn" data-act="year" data-d="1" aria-label="Année suivante">›</button>
  </div>
</header>
<main id="view"></main>
<button class="fab" id="fab" data-act="add" aria-label="Nouvelle saisie">+</button>
<nav class="tabs">
  <button data-act="tab" data-v="home"><span class="ic">◐</span>Accueil</button>
  <button data-act="tab" data-v="cal"><span class="ic">▦</span>Calendrier</button>
  <button data-act="tab" data-v="ponts"><span class="ic">⌒</span>Ponts</button>
  <button data-act="tab" data-v="list"><span class="ic">☰</span>Saisies</button>
  <button data-act="tab" data-v="trips"><span class="ic">✈</span>Voyages</button>
  <button data-act="tab" data-v="set"><span class="ic">⚙</span>Réglages</button>
</nav>
<dialog id="dlg"><div class="dlg" id="dlgBody"></div></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="importFile" accept=".json,application/json,text/plain" hidden>
<script src="app.js"></script>
</body>
</html>
