<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3F4F9">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://api.github.com; worker-src 'self'; manifest-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>Congés Duo</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Congés Duo">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
@font-face{font-family:Manrope;src:url(manrope.woff2) format("woff2");font-weight:400 800;font-display:swap}
:root{
  --bg:#F3F4F9;--card:#fff;--ink:#161A2E;--mute:#5B6178;--line:#E4E7F2;--work:#EEF0F6;--track:#E4E7F2;
  --a:#2F5BEA;--a-l:#BCCBFA;--a-soft:#E8EEFF;--a-ink:#1E3FB8;
  --b:#E8508F;--b-l:#F6C2D8;--b-soft:#FDE8F1;--b-ink:#9C1452;
  --night:#1B2140;--warn:#E07A1F;--warn-ink:#A84B0C;--warn-soft:#FFF1E3;
  --extra:#15803d;--hol:#d92d20;--hol-l:#fcd9d6;--rest:#c9ced8;--bloc:#172554;--star:#e8a317;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0F1220;--card:#1A1E2F;--ink:#ECEEF6;--mute:#A3A9BD;--line:#2A2F44;--work:#232842;--track:#2A2F44;
  --a:#5B82F5;--a-l:#2E4590;--a-soft:#1F2A55;--a-ink:#A9BEFF;
  --b:#F06A9B;--b-l:#7A2650;--b-soft:#3D1A2C;--b-ink:#FFB1CF;
  --night:#252B4A;--warn:#F0954A;--warn-ink:#FFB77A;--warn-soft:#3A2614;
  --extra:#34c26b;--hol:#ff6b5e;--hol-l:#4d2420;--rest:#3a4050;--bloc:#a9bcff;--star:#f5b82e;
  color-scheme:dark;
}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Manrope,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent;font-variant-numeric:tabular-nums}
body{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--a);outline-offset:2px}
.hide{display:none!important}
.muted{color:var(--mute);font-size:13px}
.center{text-align:center}
header.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;
  padding:calc(10px + env(safe-area-inset-top)) 14px 10px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
h1{margin:0;font-size:18px;font-weight:800;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
h1 .duo{display:inline-flex}
h1 .duo i{width:14px;height:14px;border-radius:50%;background:var(--a)}
h1 .duo i+i{background:var(--b);margin-left:-6px;opacity:.92}
.yearsel{display:flex;align-items:center;gap:2px}
.yearsel strong{min-width:46px;text-align:center}
.iconbtn{border:0;background:none;width:40px;height:40px;border-radius:12px;font-size:20px;cursor:pointer;color:var(--ink)}
.iconbtn:active{background:var(--work)}
.syncdot{position:relative;width:30px;height:40px;border:0;background:none;cursor:pointer}
.syncdot::after{content:"";position:absolute;inset:0;margin:auto;width:10px;height:10px;border-radius:50%;background:var(--rest)}
.syncdot.s-ok::after{background:var(--extra)}
.syncdot.s-wait::after{background:var(--star)}
.syncdot.s-err::after{background:var(--hol)}
.syncdot.s-busy::after{background:var(--a);animation:pulse .8s infinite alternate}
@keyframes pulse{to{opacity:.25}}
.syncline{font-size:13px;margin:8px 0 2px;color:var(--mute)}
a.btn{display:inline-block;text-decoration:none;color:inherit}
main{max-width:720px;margin:0 auto;padding:6px 16px 16px;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card{background:var(--card);border-radius:22px;padding:16px;margin-bottom:12px;border:0;box-shadow:0 1px 2px rgba(22,26,46,.04)}
.card h2,.dlg h2{margin:0 0 6px;font-size:17px;font-weight:800}
.pa{--c:var(--a);--cl:var(--a-l);--cs:var(--a-soft);--ci:var(--a-ink)} .pb{--c:var(--b);--cl:var(--b-l);--cs:var(--b-soft);--ci:var(--b-ink)}
.dot{display:inline-block;flex:none;width:10px;height:10px;border-radius:50%;background:var(--c)}
.phead{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.phead h2{margin:0}
.person{border-top:4px solid var(--c)}
.kpi{display:flex;align-items:flex-end;gap:12px;margin:4px 0 10px}
.big{font-size:44px;line-height:1;font-weight:800;color:var(--c);letter-spacing:-.03em}
.big.neg{color:var(--warn-ink)}
.kl{font-size:14px;padding-bottom:4px}
.kl small{color:var(--mute)}
.bar{display:flex;height:8px;border-radius:4px;background:var(--work);overflow:hidden;margin-bottom:8px}
.bar i{display:block;height:100%}
.bar .p{background:var(--c)}
.bar .v{background:repeating-linear-gradient(135deg,var(--c) 0 3px,transparent 3px 6px)}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.row b{font-weight:700;text-align:right}
.row small{font-weight:400}
.row>span{min-width:8.5em}
/* Accueil */
.hello{display:flex;flex-direction:column;gap:2px;margin:6px 2px 14px}
.hello h2{margin:0;font-size:28px;font-weight:800;letter-spacing:-.02em}
.hello .muted{font-weight:600;text-transform:none}
.today{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:12px}
.tcard{display:flex;flex-direction:column;gap:2px;background:var(--card);border-radius:18px;padding:12px 14px}
.tname{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--mute)}
.tcard b{font-size:15px}
.tcard small{font-size:12px;color:var(--mute)}
.hero{display:flex;flex-direction:column;gap:8px;background:var(--night);color:#fff;border-radius:26px;padding:20px;margin-bottom:12px}
.herot{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:#C9CEE6}
.herobig{display:flex;align-items:baseline;gap:8px}
.herobig b{font-size:56px;line-height:1;font-weight:800;letter-spacing:-.03em}
.herobig span{font-size:18px;font-weight:700}
.herosub{font-size:14px;color:#E3E6F5}
.herobars{display:flex;gap:4px;margin-top:4px}
.herobars span{flex:1;height:6px;border-radius:3px;background:var(--c)}
.rings{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:12px}
.ring{display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--card);border:0;border-radius:22px;padding:16px 10px;cursor:pointer;text-align:center}
.ringwrap{position:relative;width:104px;height:104px}
.ringwrap svg{display:block}
.ring .arc{transition:stroke-dasharray .9s cubic-bezier(.2,.8,.2,1)}
.ringval{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800;color:var(--ci)}
.ringval.over{color:var(--warn-ink)}
.ring b{font-size:15px}
.ring small{font-size:12px;color:var(--mute)}
.pendh{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.pendh h2{margin:0}
.linkbtn{border:0;background:none;color:var(--a);font-weight:800;font-size:13px;cursor:pointer;padding:8px 0}
.pendrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.pendrow .grow{flex:1;min-width:0;display:flex;flex-direction:column}
.pendrow small{font-size:12px;color:var(--mute)}
.waitlbl{font-size:12px;font-weight:700;color:var(--mute);background:var(--work);border-radius:10px;padding:6px 10px;white-space:nowrap}
.vbtn{height:44px;padding:0 14px;border:0;border-radius:12px;background:var(--cs);color:var(--ci);font-weight:800;font-size:13px;cursor:pointer}
.nextappt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;cursor:pointer}
.nextappt .grow{flex:1;display:flex;flex-direction:column}
.nextappt small{font-size:12px;color:var(--mute)}
.napi{width:44px;height:44px;border-radius:14px;background:var(--warn-soft);color:var(--warn-ink);display:flex;align-items:center;justify-content:center;flex:none}
.pagetitle{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:8px 2px 14px}
.morelist{display:flex;flex-direction:column;gap:10px}
.moreitem{display:flex;align-items:center;gap:14px;background:var(--card);border:0;border-radius:20px;padding:14px 16px;text-align:left;cursor:pointer;font-size:20px;color:var(--mute)}
.moreitem .grow{flex:1;display:flex;flex-direction:column}
.moreitem b{font-size:16px;color:var(--ink)}
.moreitem small{font-size:13px;color:var(--mute)}
.moreic{width:46px;height:46px;border-radius:14px;background:var(--a-soft);color:var(--a-ink);display:flex;align-items:center;justify-content:center;flex:none}
.back{border:0;background:none;color:var(--a);font-weight:800;font-size:15px;padding:8px 2px;cursor:pointer}
/* Calendrier */
.monthbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.monthbar strong{font-size:20px;font-weight:800;text-transform:capitalize}
.who{display:flex;justify-content:center;gap:16px;font-size:12px;color:var(--mute);margin-bottom:8px}
.who span{display:flex;align-items:center;gap:5px}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;background:var(--card);border-radius:22px;padding:10px 6px}
.dow{text-align:center;font-size:11px;font-weight:700;color:var(--mute);padding-bottom:2px}
.day{position:relative;display:flex;flex-direction:column;gap:3px;min-height:58px;padding:5px 3px;border:0;border-radius:12px;background:transparent;text-align:left;cursor:pointer}
.day:active{background:var(--work)}
.day.empty{visibility:hidden}
.day .num{font-size:14px;font-weight:700;line-height:1.15;margin-bottom:auto}
.day .mk{font-size:9px;font-weight:400;margin-left:2px;letter-spacing:-1px}
.day.hol .num{color:var(--hol)}
.day.today{box-shadow:inset 0 0 0 2px var(--ink)}
.day.both{background:color-mix(in srgb,var(--star) 12%,transparent)}
.day .star{position:absolute;top:3px;right:4px;font-size:11px;line-height:1;color:var(--star)}
.day .otm{position:absolute;top:4px;right:16px;font-size:10px;font-weight:800;color:var(--b)}
.lane{display:flex;gap:1px;height:6px;border-radius:3px;overflow:hidden}
.lane .h{flex:1;background:var(--work)}
.h.k-rest{background:var(--rest)}
.h.k-hol{background:var(--hol-l)}
.h.k-conge.s-pris{background:var(--c)}
.h.k-conge.s-prevu{background:repeating-linear-gradient(135deg,var(--c) 0 2px,transparent 2px 5px);box-shadow:inset 0 0 0 1.5px var(--c)}
.h.k-recup.s-pris{background:var(--cl);box-shadow:inset 0 0 0 1.5px var(--c)}
.h.k-recup.s-prevu{background:repeating-linear-gradient(135deg,var(--cl) 0 2px,transparent 2px 5px);box-shadow:inset 0 0 0 1.5px var(--c)}
.h.k-bloc.s-pris{background:var(--bloc)}
.h.k-bloc.s-prevu{background:repeating-linear-gradient(135deg,var(--bloc) 0 2px,transparent 2px 5px);box-shadow:inset 0 0 0 1.5px var(--bloc)}
.h.k-extra.s-pris{background:var(--extra)}
.h.k-extra.s-prevu{background:repeating-linear-gradient(135deg,var(--extra) 0 2px,transparent 2px 5px);box-shadow:inset 0 0 0 1.5px var(--extra)}
.hols{font-size:13px;color:var(--hol);margin:10px 2px 0}
.legend{display:flex;flex-wrap:wrap;gap:8px 12px;margin-top:12px;font-size:12px;color:var(--mute)}
.legend>span{display:flex;align-items:center;gap:4px}
.lane.sw{width:22px;height:8px;display:inline-flex}
.starl{color:var(--star)} .otl{color:var(--b)}
/* Ponts, listes */
.opt{padding:10px 0;border-top:1px solid var(--line)}
.opt-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:4px}
.opt-p{display:flex;gap:7px;align-items:baseline;font-size:14px;margin:3px 0}
.opt .btn{margin-top:6px}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:1px 8px;border-radius:8px;border:1px solid var(--line);color:var(--mute);vertical-align:1px}
.tag.prevu{border-style:dashed}
.tag.ok{color:var(--extra);border-color:var(--extra);margin-top:6px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{border:0;background:var(--card);border-radius:20px;padding:8px 16px;cursor:pointer;font-size:14px;font-weight:700}
.chip.on{background:var(--ink);color:var(--bg)}
.list{padding:4px 14px}
.entry{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.list .entry:first-child{border-top:0}
.entry .grow{flex:1;min-width:0}
.entry .iconbtn{width:36px;height:36px;font-size:16px;color:var(--mute)}
/* Formulaires */
.btn{border:0;background:var(--work);border-radius:14px;padding:11px 16px;cursor:pointer;font-weight:700}
.btn.pri{background:var(--a);color:#fff;box-shadow:0 8px 20px color-mix(in srgb,var(--a) 30%,transparent)}
.btn.danger{color:var(--hol);background:color-mix(in srgb,var(--hol) 10%,transparent)}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:12px}
.btn.wide{width:100%;margin-bottom:10px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.btns.end{justify-content:flex-end}
.field{display:block;margin:10px 0}
.lbl{display:block;font-size:12px;font-weight:700;color:var(--mute);margin:12px 0 6px}
.field .lbl{margin:0 0 5px}
input:not([type=checkbox]):not([type=radio]),select,textarea{width:100%;min-width:0;font:inherit;padding:11px 12px;border:2px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink)}
input:focus,select:focus,textarea:focus{border-color:var(--a);outline:0}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.two .field{margin:10px 0 0}
.check{display:flex;align-items:center;gap:8px;margin:14px 0 4px;font-size:14px}
.check input{width:20px;height:20px;accent-color:var(--c)}
.sub{padding-left:12px;border-left:3px solid var(--cl)}
.seg{display:flex;background:var(--work);border-radius:14px;padding:4px;gap:4px}
.seg label{flex:1;text-align:center;cursor:pointer}
.seg span{display:block;padding:9px 4px;font-size:14px;font-weight:700;border-radius:11px;color:var(--mute)}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg input:checked+span{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(22,26,46,.12)}
.seg input:focus-visible+span{outline:2px solid var(--a);outline-offset:-2px}
.days7{display:flex;gap:4px}
.days7 label{flex:1;text-align:center;border:2px solid var(--line);border-radius:10px;padding:7px 0;font-size:13px;cursor:pointer}
.days7 input{position:absolute;opacity:0;pointer-events:none}
.days7 label:has(input:checked){background:var(--rest);border-color:var(--rest);font-weight:700}
.chips2{display:flex;gap:8px}
.chip2{flex:1;height:48px;border:2px solid var(--line);border-radius:14px;background:var(--card);font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer}
.chip2.on{border-color:var(--a);background:var(--a-soft);color:var(--a-ink);font-weight:800}
.chip2 .dot{width:10px;height:10px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:6px}
.tile{height:96px;border:2px solid var(--line);border-radius:18px;background:var(--card);display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:2px;padding:0 14px;cursor:pointer;text-align:left;color:var(--a-ink)}
.tile:active{background:var(--a-soft);border-color:var(--a)}
.tile b{font-size:16px;color:var(--ink);margin-top:4px}
.tile small{font-size:12px;color:var(--mute)}
.preview{background:var(--work);border-radius:16px;padding:12px 14px;font-size:14px;display:flex;flex-direction:column;gap:6px}
.preview:empty{display:none}
.preview small{color:var(--mute)}
.big2{font-size:18px;font-weight:800}
/* Sections repliables */
.sect{background:var(--card);border-radius:22px;margin-bottom:12px;overflow:hidden}
.sect>summary{display:flex;align-items:center;gap:10px;padding:16px;font-weight:800;font-size:16px;cursor:pointer;list-style:none}
.sect>summary::-webkit-details-marker{display:none}
.sect>summary .grow{flex:1}
.sect .plus{width:30px;height:30px;border-radius:50%;background:var(--work);display:grid;place-items:center;font-size:18px;line-height:1}
.sect .plus::after{content:"+"}
.sect[open]>summary .plus::after{content:"−"}
.sect[open]>summary{border-bottom:1px solid var(--line)}
.sect-b{padding:4px 16px 14px}
.sect-b h4{margin:16px 0 0;font-size:14px}
.sect-b .card{margin:12px 0 0;padding:0;box-shadow:none}
.sect-b .person{border-top:0}
.calc{margin:8px 0 0;font-size:14px}
/* Agenda et voyages */
.trip-h{display:flex;align-items:flex-start;gap:8px}
.trip-h .grow{flex:1;min-width:0}
.who-l{display:flex;gap:12px;font-size:13px;margin-top:4px;flex-wrap:wrap}
.tnotes{white-space:pre-wrap;font-size:14px;margin:10px 0 0}
.item{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:14px;align-items:flex-start}
.item .ico{font-size:20px;line-height:1.2}
.item .grow{flex:1;min-width:0;overflow-wrap:anywhere}
.hint-ios{box-shadow:inset 0 0 0 2px var(--a);font-size:14px}
.dst{box-shadow:inset 0 0 0 2px var(--star);font-size:14px}
.warn{color:var(--hol);font-size:13px;margin-top:4px}
h3.sec{margin:18px 2px 8px;font-size:15px}
textarea[readonly]{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;word-break:break-all}
/* Fenêtres : panneau qui monte du bas sur téléphone */
dialog{border:0;padding:0;border-radius:24px;width:min(540px,94vw);background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgb(15 18 32 / .5)}
dialog[open]{animation:sheet .28s cubic-bezier(.2,.8,.2,1)}
@keyframes sheet{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@media (max-width:600px){dialog{width:100%;max-width:100%;margin:auto 0 0;border-radius:26px 26px 0 0}}
.dlg{padding:10px 18px calc(16px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.dlg::before{content:"";display:block;width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.dlg h2{font-size:22px;letter-spacing:-.01em}
.dlg h3{margin:16px 0 0;font-size:15px}
.holname{color:var(--hol);margin:0 0 4px;font-weight:700}
.existing .entry:first-child{border-top:0}
.hint{margin:4px 0}
/* Navigation */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:center;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 0 calc(6px + env(safe-area-inset-bottom))}
nav.tabs button[data-v]{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border:0;background:none;color:var(--mute);font-size:11px;font-weight:700;cursor:pointer}
nav.tabs button.on{color:var(--a);font-weight:800}
.fabcell{display:flex;justify-content:center}
.fab{width:60px;height:60px;margin-top:-28px;border:0;border-radius:20px;background:var(--a);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 10px 24px color-mix(in srgb,var(--a) 40%,transparent);transition:transform .15s}
.fab:active{transform:scale(.94)}
.toast{position:fixed;left:50%;bottom:calc(104px + env(safe-area-inset-bottom));z-index:30;transform:translateX(-50%) translateY(10px);max-width:92vw;display:flex;align-items:center;gap:12px;
  padding:12px 16px;border-radius:16px;background:var(--night);color:#fff;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;box-shadow:0 10px 30px rgba(15,18,32,.3)}
.toast.on{opacity:1;transform:translateX(-50%)}
.toast.act{pointer-events:auto}
.toastbtn{border:0;background:none;color:#9DB4FF;font-weight:800;font-size:14px;padding:6px 4px;cursor:pointer}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (min-width:600px){.day{min-height:72px}.lane{height:8px}}
</style>
</head>
<body>
<header class="top">
  <h1><span class="duo" aria-hidden="true"><i></i><i></i></span>Congés Duo</h1>
  <div class="yearsel">
    <button class="syncdot s-off" id="syncDot" data-act="sync" aria-label="Synchroniser avec GitHub"></button>
    <button class="iconbtn" data-act="year" data-d="-1" aria-label="Année précédente">‹</button>
    <strong id="yearLbl"></strong>
    <button class="iconbtn" data-act="year" data-d="1" aria-label="Année suivante">›</button>
  </div>
</header>
<main id="view"></main>
<nav class="tabs" aria-label="Navigation">
  <button data-act="tab" data-v="home"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7"></path><path d="M5 10v10h14V10"></path></svg>Accueil</button>
  <button data-act="tab" data-v="cal"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>Calendrier</button>
  <div class="fabcell"><button class="fab" id="fab" data-act="add" aria-label="Ajouter"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button></div>
  <button data-act="tab" data-v="trips"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"></path><circle cx="12" cy="9.5" r="2.5"></circle></svg>Agenda</button>
  <button data-act="tab" data-v="more"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="5" cy="12" r="1.6"></circle><circle cx="12" cy="12" r="1.6"></circle><circle cx="19" cy="12" r="1.6"></circle></svg>Plus</button>
</nav>
<dialog id="dlg"><div class="dlg" id="dlgBody"></div></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="importFile" accept=".json,application/json,text/plain" hidden>
<script src="app.js"></script>
</body>
</html>
